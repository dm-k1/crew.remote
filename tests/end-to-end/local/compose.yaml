# crew.remote's local test: the AWS flow without AWS. A boss and two worker
# "machines" (containers), S3 replaced by moto (Python's AWS mock, in server
# mode), and the instance metadata
# service replaced by AWS's own mock (amazon-ec2-metadata-mock), which gives
# worker-b a spot interruption notice 75 seconds in; worker-c's setup fails. 30 seconds in, the boss
# is lost and comes back under another address (boss.sh). The boss runs the
# checks at the end (../check.R); its exit status is the test's.
#
#   docker compose -f tests/end-to-end/local/compose.yaml up --build --abort-on-container-exit --exit-code-from boss
x-aws: &aws
  AWS_ACCESS_KEY_ID: crewremote
  AWS_SECRET_ACCESS_KEY: crewremote-secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://s3:5000
  RUN_FOLDER: s3://crew-remote-test/local
  TASKS: "80"
  TASK_SECONDS: "5"
  CREW_REMOTE_WATCH_SECONDS: "3"
  EXPECT_SPOT: "1"
  EXPECT_FAILED: "worker-c"

services:
  s3:
    image: motoserver/moto:latest

  imds-b:
    image: public.ecr.aws/aws-ec2/amazon-ec2-metadata-mock:v1.13.0
    command: ["spot", "-d", "75", "-a", "terminate", "-I"]

  boss:
    build: {context: ../../.., dockerfile: tests/end-to-end/local/Dockerfile}
    hostname: boss
    init: true # reaps the lost boss's processes, so targets sees them gone
    networks:
      default:
        aliases: [boss-again]
    environment: *aws
    command: bash tests/end-to-end/local/boss.sh
    depends_on: [s3]

  worker-a:
    build: {context: ../../.., dockerfile: tests/end-to-end/local/Dockerfile}
    hostname: worker-a
    environment: {<<: *aws, CREW_REMOTE_IMDS: "http://127.0.0.1:9"}
    command: bash tests/end-to-end/local/worker.sh
    depends_on: [s3]

  worker-b:
    build: {context: ../../.., dockerfile: tests/end-to-end/local/Dockerfile}
    hostname: worker-b
    environment: {<<: *aws, CREW_REMOTE_IMDS: "http://imds-b:1338"}
    command: bash tests/end-to-end/local/worker.sh
    depends_on: [s3, imds-b]

  worker-c:
    build: {context: ../../.., dockerfile: tests/end-to-end/local/Dockerfile}
    hostname: worker-c
    environment: {<<: *aws, CREW_REMOTE_IMDS: "http://127.0.0.1:9", BREAK_SETUP: "1"}
    command: bash tests/end-to-end/local/worker.sh
    depends_on: [s3]
